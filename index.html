<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veanix AI — Full Khmer Voice Loop Tester</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      font-family: 'Kantumruy Pro', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #121214;
      color: #f4f4f6;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
      margin: 0;
    }
    .container {
      background: #1e1e22;
      border: 1px solid #2e2e34;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    h2 { margin-top: 0; font-size: 1.25rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: block; font-size: 0.82rem; color: #a1a1aa; margin: 12px 0 6px; }
    input, select {
      width: 100%; box-sizing: border-box;
      background: #27272c; border: 1px solid #3f3f46;
      border-radius: 10px; color: #fff; padding: 10px 12px;
      font-size: 0.95rem; font-family: inherit;
    }
    .mic-btn {
      width: 100%; margin-top: 20px; padding: 16px;
      border: none; border-radius: 12px;
      background: #2563eb; color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .mic-btn.recording { background: #dc2626; animation: pulse 1.2s infinite; }
    .mic-btn:disabled { background: #3f3f46; cursor: not-allowed; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.75; } 100% { opacity: 1; } }
    .status { margin-top: 12px; font-size: 0.88rem; color: #a1a1aa; text-align: center; }
    .chat-box {
      margin-top: 20px; background: #161619;
      border: 1px solid #2a2a30; border-radius: 12px;
      padding: 16px; min-height: 140px; max-height: 320px; overflow-y: auto;
    }
    .msg { margin-bottom: 14px; line-height: 1.6; }
    .msg.user { color: #93c5fd; }
    .msg.ai {
      background: #27272c; padding: 12px; border-radius: 10px; color: #f4f4f6;
    }
    audio { width: 100%; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Veanix AI — Full Khmer Voice Loop</h2>

    <div class="grid">
      <div>
        <label for="kiriKey">Kiri TTS / STT API Key</label>
        <input type="password" id="kiriKey" placeholder="Bearer token..." />
      </div>
      <div>
        <label for="llmKey">OpenAI API Key (for AI Reply)</label>
        <input type="password" id="llmKey" placeholder="sk-..." />
      </div>
    </div>

    <div class="grid">
      <div>
        <label for="voice">Kiri Khmer Voice</label>
        <select id="voice">
          <option value="Maly">Maly (Female)</option>
          <option value="Cheata">Cheata (Female)</option>
          <option value="Sokha">Sokha (Male)</option>
          <option value="Vireak">Vireak (Male)</option>
        </select>
      </div>
      <div>
        <label for="sttProvider">Speech-to-Text Engine</label>
        <select id="sttProvider">
          <option value="openai">OpenAI Whisper (km)</option>
          <option value="kiri">Kiri STT (/v1/audio/transcriptions)</option>
        </select>
      </div>
    </div>

    <button id="recordBtn" class="mic-btn" onclick="toggleRecording()">
      🎙️ Start Speaking Khmer
    </button>
    <div class="status" id="status">Click the button and speak in Khmer.</div>

    <div class="chat-box" id="chatBox">
      <div class="msg" style="color:#71717a;">Conversation history will appear here...</div>
    </div>

    <audio id="audioPlayer" controls hidden></audio>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    async function toggleRecording() {
      const btn = document.getElementById('recordBtn');
      const statusEl = document.getElementById('status');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(track => track.stop());
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            await processVoicePipeline(audioBlob);
          };

          mediaRecorder.start();
          isRecording = true;
          btn.textContent = '⏹️ Stop & Send';
          btn.classList.add('recording');
          statusEl.textContent = '🔴 Listening... Speak Khmer now.';
        } catch (err) {
          statusEl.textContent = `❌ Microphone error: ${err.message}`;
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.textContent = '🎙️ Start Speaking Khmer';
        btn.classList.remove('recording');
      }
    }

    async function processVoicePipeline(audioBlob) {
      const kiriKey = document.getElementById('kiriKey').value.trim();
      const llmKey = document.getElementById('llmKey').value.trim();
      const voice = document.getElementById('voice').value;
      const sttProvider = document.getElementById('sttProvider').value;
      const btn = document.getElementById('recordBtn');
      const statusEl = document.getElementById('status');
      const audioPlayer = document.getElementById('audioPlayer');

      if (!kiriKey || !llmKey) {
        statusEl.textContent = '⚠️ Please enter both your Kiri API key and OpenAI API key.';
        return;
      }

      btn.disabled = true;

      try {
        // STEP 1: Speech-to-Text (Khmer Audio -> Khmer Text)
        statusEl.textContent = '1/3 ⏳ Transcribing Khmer audio...';
        const formData = new FormData();
        formData.append('file', audioBlob, 'speech.webm');
        formData.append('language', 'km');

        let sttUrl = 'https://openai.com';
        let sttAuth = llmKey;
        if (sttProvider === 'kiri') {
          sttUrl = 'https://kiritts.com';
          sttAuth = kiriKey;
          formData.append('model', 'kiritts-stt');
        } else {
          formData.append('model', 'whisper-1');
        }

        const sttRes = await fetch(sttUrl, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${sttAuth}` },
          body: formData
        });
        if (!sttRes.ok) throw new Error(`STT Failed (${sttRes.status}): ${await sttRes.text()}`);
        const sttData = await sttRes.json();
        const userKhmerText = sttData.text;
        appendMessage('user', `🗣️ You: ${userKhmerText}`);

        // STEP 2: AI Assistant Reply (Khmer Text -> Khmer AI Response)
        statusEl.textContent = '2/3 🤖 Generating Khmer AI reply...';
        const chatRes = await fetch('https://openai.com', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${llmKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [
              {
                role: 'system',
                content: 'You are the Veanix smart glasses AI assistant. Always answer concisely and naturally in Khmer script (ភាសាខ្មែរ) suitable for voice playback.'
              },
              { role: 'user', content: userKhmerText }
            ]
          })
        });
        if (!chatRes.ok) throw new Error(`AI Chat Failed (${chatRes.status}): ${await chatRes.text()}`);
        const chatData = await chatRes.json();
        const aiKhmerReply = chatData.choices[0].message.content;
        appendMessage('ai', `🤖 Veanix: ${aiKhmerReply}`);

        // STEP 3: Kiri TTS (Khmer AI Response -> Spoken Audio)
        statusEl.textContent = '3/3 🔊 Synthesizing Kiri TTS voice...';
        const ttsRes = await fetch('https://kiritts.com', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${kiriKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'kiritts',
            input: aiKhmerReply,
            voice: voice,
            response_format: 'mp3'
          })
        });
        if (!ttsRes.ok) throw new Error(`Kiri TTS Failed (${ttsRes.status}): ${await ttsRes.text()}`);

        const mp3Blob = await ttsRes.blob();
        audioPlayer.src = URL.createObjectURL(mp3Blob);
        audioPlayer.hidden = false;
        await audioPlayer.play();

        statusEl.textContent = '✅ Loop complete! Click to ask another question.';
      } catch (err) {
        console.error(err);
        statusEl.textContent = `❌ ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById('chatBox');
      if (chatBox.children.length === 1 && chatBox.children[0].style.color === 'rgb(113, 113, 122)') {
        chatBox.innerHTML = '';
      }
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
